<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Il Rifugio</title>
<style>
  html,body{margin:0;height:100%;background:#a9c9e6;font:16px/1.4 system-ui,sans-serif;color:#1f2a37}
  #boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 24px;box-sizing:border-box}
  #boot b{font-size:28px}
  #boot span{color:#4a5a6b;font-size:14px}
  #boot .row{display:none;gap:12px;margin-top:8px}
  #boot.err .row{display:flex}
  #boot .prog{display:none;width:min(280px,70vw);height:12px;border-radius:6px;background:#fff;overflow:hidden}
  #boot .prog i{display:block;height:100%;width:0;background:#2b6cb0;transition:width .15s linear}
  #boot.upd .prog{display:block}
  #boot.upd.unk .prog i{width:40%;animation:slide 1.1s ease-in-out infinite alternate}
  @keyframes slide{from{margin-left:0}to{margin-left:60%}}
  #boot.err b{color:#9b2c2c}
  #boot button{font:600 16px system-ui,sans-serif;padding:12px 24px;border:0;border-radius:12px;background:#2b6cb0;color:#fff}
  #boot button.sec{background:#fff;color:#1f2a37}
</style>
</head>
<body>
<div id="boot"><b id="title"></b><div class="prog"><i id="bar"></i></div><span id="msg"></span>
  <div class="row"><button id="retry">Riprova</button><button id="quit" class="sec">Esci</button></div>
</div>
<script>
// Caricatore dell'app Android.
// All'avvio chiede a GitHub qual è l'ultimo commit del branch di sviluppo e scarica da lì i file del gioco (cartella web/),
// così ogni modifica pubblicata arriva sul telefono senza reinstallare l'APK. I file scaricati restano in cache per commit,
// ma l'app si avvia solo se riesce a sapere qual è l'ultimo commit: senza rete (o senza una versione aggiornata)
// mostra un errore con i tasti Riprova ed Esci. La copia in game/ serve solo per librerie, font e icone.
(function () {
  'use strict';
  var REPO = 'simof51/Il-rifugio';
  var BRANCH = 'claude/il-rifugio-old-branch-d4kcaa';
  var API = 'https://api.github.com/repos/' + REPO + '/commits/' + encodeURIComponent(BRANCH);
  var SHA_KEY = 'rifugio-remote-sha', CACHE = 'rifugio-remote';
  var msg = document.getElementById('msg');

  function withTimeout(p, ms) {
    return Promise.race([p, new Promise(function (_, no) { setTimeout(function () { no(new Error('timeout')); }, ms); })]);
  }
  var boot = document.getElementById('boot'), title = document.getElementById('title');
  function fail(why) {
    try { console.warn('Avvio non riuscito:', why); } catch (e) {}
    boot.className = 'err';
    title.textContent = 'Serve internet';
    msg.textContent = 'Il Rifugio ha bisogno di internet per avviarsi e aggiornarsi. Controlla la connessione e riprova.';
  }
  function quit() {
    try { window.Capacitor.Plugins.App.exitApp(); return; } catch (e) {}
    window.close();
  }
  function start() {
    // All'avvio normale non si mostra nulla: la schermata resta vuota finché il gioco parte.
    boot.className = '';
    title.textContent = '';
    msg.textContent = '';
    dl = 0; total = 0; bar.style.width = '0';
    getSha().then(run).catch(fail);
  }
  // Avanzamento dell'aggiornamento (solo se ci sono file da scaricare): byte scaricati e totali, in MB.
  var dl = 0, total = 0, bar = document.getElementById('bar');
  function mb(n) { return (n / 1048576).toFixed(2).replace('.', ','); }
  function showProgress() {
    if (total > 0) {
      var shown = Math.min(dl, total);
      bar.style.width = (shown / total * 100).toFixed(1) + '%';
      msg.textContent = mb(shown) + ' / ' + mb(total) + ' MB';
    } else msg.textContent = mb(dl) + ' MB';
  }
  function beginUpdate(sha, paths) {
    boot.className = 'upd unk';
    title.textContent = 'Aggiornamento app';
    msg.textContent = '';
    // Dimensioni dei file da scaricare: una sola richiesta all'elenco dei file del commit (nessuna perdita se fallisce).
    var url = 'https://api.github.com/repos/' + REPO + '/git/trees/' + sha + '?recursive=1';
    return withTimeout(fetch(url), 6000).then(function (r) { if (!r.ok) throw new Error('tree ' + r.status); return r.json(); })
      .then(function (j) {
        var size = {}; (j.tree || []).forEach(function (f) { size[f.path] = f.size; });
        var sum = 0, ok = true;
        paths.forEach(function (p) { if (typeof size['web/' + p] === 'number') sum += size['web/' + p]; else ok = false; });
        if (ok && sum > 0) { total = sum; boot.className = 'upd'; }
        showProgress();
      }).catch(function () { showProgress(); });
  }
  function download(url, c) {
    return withTimeout(fetch(url), 30000).then(function (r) {
      if (!r.ok) throw new Error(url + ' ' + r.status);
      if (!r.body || !r.body.getReader) return r.text().then(function (t) { dl += t.length; showProgress(); return t; });
      var rd = r.body.getReader(), parts = [];
      var pump = function () {
        return rd.read().then(function (x) {
          if (x.done) return;
          parts.push(x.value); dl += x.value.length; showProgress(); return pump();
        });
      };
      return pump().then(function () {
        var dec = new TextDecoder('utf-8'), t = '';
        parts.forEach(function (p) { t += dec.decode(p, { stream: true }); });
        t += dec.decode();
        return t;
      });
    }).then(function (t) {
      if (c) c.put(url, new Response(t, { headers: { 'content-type': 'text/plain; charset=utf-8' } }));
      return t;
    });
  }
  function getSha() {
    // no-cache: il WebView rivalida con l'ETag, e le risposte 304 non consumano il limite di richieste di GitHub.
    return withTimeout(fetch(API, { cache: 'no-cache' }), 10000)
      .then(function (r) { if (!r.ok) throw new Error('GitHub ' + r.status); return r.json(); })
      .then(function (j) { return j.sha; });
  }
  function getText(url, track) {
    var store = window.caches ? caches.open(CACHE) : Promise.resolve(null);
    return store.then(function (c) {
      return (c ? c.match(url) : Promise.resolve(null)).then(function (hit) {
        if (hit) return hit.text();
        if (track) return download(url, c);
        return withTimeout(fetch(url), 30000).then(function (r) {
          if (!r.ok) throw new Error(url + ' ' + r.status);
          if (c) c.put(url, r.clone());
          return r.text();
        });
      });
    });
  }
  function isCached(url) {
    if (!window.caches) return Promise.resolve(false);
    return caches.open(CACHE).then(function (c) { return c.match(url); }).then(function (h) { return !!h; }).catch(function () { return false; });
  }
  function pruneCache(sha) {
    if (!window.caches) return;
    caches.open(CACHE).then(function (c) {
      return c.keys().then(function (keys) { keys.forEach(function (k) { if (k.url.indexOf('/' + sha + '/') < 0) c.delete(k); }); });
    }).catch(function () {});
  }

  function run(sha) {
    var base = 'https://raw.githubusercontent.com/' + REPO + '/' + sha + '/web/';
    return getText(base + 'index.html').then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var isLocal = function (u) { return u && !/^[a-z]+:|^\/\//i.test(u); };
      var scripts = Array.prototype.slice.call(doc.querySelectorAll('script'));
      var styles = Array.prototype.slice.call(doc.querySelectorAll('link[rel="stylesheet"]')).filter(function (l) { return isLocal(l.getAttribute('href')); });
      // File da prendere da GitHub (le librerie in lib/ vengono dalla copia nell'app).
      var paths = [];
      scripts.forEach(function (s) { var src = s.getAttribute('src'); if (isLocal(src) && !/^lib\//.test(src)) paths.push(src); });
      styles.forEach(function (l) { paths.push(l.getAttribute('href')); });
      // Solo se c'è qualcosa da scaricare compare la barra "Aggiornamento app".
      return Promise.all(paths.map(function (p) { return isCached(base + p); })).then(function (flags) {
        var pending = paths.filter(function (p, i) { return !flags[i]; });
        return pending.length ? beginUpdate(sha, pending) : null;
      }).then(function () {
      // GitHub serve i file come testo semplice: script e fogli di stile vanno scaricati e inseriti nella pagina.
      return Promise.all([
        Promise.all(scripts.map(function (s) {
          var src = s.getAttribute('src');
          if (!isLocal(src)) return Promise.resolve(null);
          // Le librerie (lib/, es. Three.js) cambiano di rado: si usa la copia nell'app invece di riscaricarle.
          if (/^lib\//.test(src)) return fetch('game/' + src).then(function (r) { if (!r.ok) throw new Error(src); return r.text(); }).catch(function () { return getText(base + src, true); });
          return getText(base + src, true);
        })),
        Promise.all(styles.map(function (l) { return getText(base + l.getAttribute('href'), true); }))
      ]);
      }).then(function (res) {
        var codes = res[0], css = res[1];
        styles.forEach(function (l, i) { var st = doc.createElement('style'); st.textContent = css[i]; l.replaceWith(st); });
        scripts.forEach(function (s) { s.remove(); });
        // Il resto (font, icone) si prende dalla copia inclusa nell'app, così funziona anche offline.
        // Un'immagine o un font nuovi arrivano quindi solo con un nuovo APK.
        var b = doc.createElement('base'); b.href = new URL('game/', location.href).href; doc.head.insertBefore(b, doc.head.firstChild);
        window.RIFUGIO_REMOTE = { repo: REPO, branch: BRANCH, sha: sha, api: API };
        document.title = doc.title;
        document.head.innerHTML = doc.head.innerHTML;
        document.body.innerHTML = doc.body.innerHTML;
        scripts.forEach(function (s, i) {
          var el = document.createElement('script');
          el.text = codes[i] != null ? codes[i] + '\n//# sourceURL=' + s.getAttribute('src') : s.text;
          document.body.appendChild(el); // uno script inline inserito così viene eseguito subito, in ordine
        });
        try { localStorage.setItem(SHA_KEY, sha); } catch (e) {}
        pruneCache(sha);
      });
    });
  }

  document.getElementById('retry').addEventListener('click', start);
  document.getElementById('quit').addEventListener('click', quit);
  start();
})();
</script>
</body>
</html>
