name: Test
# Controlli automatici sui dati del gioco (tappe, sblocchi, traduzioni, missioni, salvataggi). Partono a ogni push.
on:
  push:
    paths: ['web/**', 'tests/**']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/run.js
