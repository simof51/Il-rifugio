# Costruisce l'AAB FIRMATO per il Google Play (test interni e pubblicazione). Si avvia a mano: Actions → "AAB Play Store" → "Run workflow".
# Differenze dall'APK di prova: il gioco è tutto dentro l'app (niente download di codice), firma con la TUA chiave privata
# (dai segreti del repository, mai nel codice), acquisti in app attivi (Google Play Billing) solo se l'app è installata dal Play.
#
# Segreti da creare in GitHub → Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64  il file .jks in base64 (vedi app/README.md)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: AAB Play Store

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aab
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controllo dei segreti di firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Mancano i segreti di firma (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Vedi app/README.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Progetto Capacitor (versione inclusa)
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          node prepare-www.js --bundled
          npx cap add android
          npx cap sync android

      - name: Permesso di fatturazione, icona e versione
        working-directory: app/android/app
        run: |
          grep -q "com.android.vending.BILLING" src/main/AndroidManifest.xml || sed -i 's#</manifest>#    <uses-permission android:name="com.android.vending.BILLING" />\n</manifest>#' src/main/AndroidManifest.xml
          rm -f src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
          for d in src/main/res/mipmap-*dpi; do
            cp ../../../web/icons/icon-192.png "$d/ic_launcher.png"
            cp ../../../web/icons/icon-192.png "$d/ic_launcher_round.png"
            rm -f "$d/ic_launcher_foreground.png"
          done
          find src/main/res -name splash.png -exec cp ../../res/splash.png {} \;
          # versionCode deve crescere a ogni caricamento sul Play: si usa il numero della corsa
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -E "versionCode|versionName" build.gradle

      - name: Firma e compila l'AAB
        working-directory: app/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat >> app/build.gradle <<EOF

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv('RELEASE_JKS'))
                      storePassword System.getenv('KSP')
                      keyAlias System.getenv('KA')
                      keyPassword System.getenv('KP')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          RELEASE_JKS="$RUNNER_TEMP/release.jks" ./gradlew bundleRelease --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab ../../il-rifugio.aab

      - uses: actions/upload-artifact@v4
        with:
          name: il-rifugio-aab
          path: il-rifugio.aab
          retention-days: 14
